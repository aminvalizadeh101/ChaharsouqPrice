
name: Build Chaharsouq Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChaharsouqPrice-Android-Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o ChaharsouqPrice-Android-Project.zip -d .

      - name: Build APK
        run: gradle -p chaharsouq-app assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ChaharsouqPrice-APK
          path: chaharsouq-app/app/build/outputs/apk/debug/app-debug.apk
